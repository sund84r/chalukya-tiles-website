<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Living Room">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d3a36"/>
      <stop offset="100%" stop-color="#1f1d1b"/>
    </linearGradient>
    <pattern id="p" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="78" height="78" x="1" y="1" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#p)"/>
  <rect x="60" y="60" width="680" height="480" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2f7de1" stroke-opacity="0.35"/>
  <text x="400" y="310" text-anchor="middle" fill="#ffffff" fill-opacity="0.92" font-family="Georgia, serif" font-size="28" letter-spacing="3">Living Room</text>
</svg>
