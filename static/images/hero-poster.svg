<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Showroom abstract background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a3d"/>
      <stop offset="45%" stop-color="#122a5c"/>
      <stop offset="100%" stop-color="#0b1f4a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#4da6e8" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#2f7de1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1f4a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tiles" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="118" height="118" x="1" y="1" fill="#16305f" stroke="#4da6e8" stroke-opacity="0.12" stroke-width="1"/>
      <rect width="48" height="48" x="22" y="22" fill="#4da6e8" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#tiles)" opacity="0.65"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect x="0" y="720" width="1920" height="360" fill="#06122e" opacity="0.45"/>
</svg>
