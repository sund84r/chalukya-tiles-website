<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login | {{ brand_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css?v195-login">
  <link rel="icon" type="image/png" href="/static/icons/favicon-32.png?v=193" sizes="32x32">
  <link rel="icon" type="image/png" href="/static/icons/favicon-48.png?v=193" sizes="48x48">
  <link rel="icon" href="/static/icons/favicon.ico?v=193" sizes="any">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=193">
</head>
<body class="admin-login-body">
  <main class="admin-login">
    <div class="admin-login__card">
      <div class="admin-login__brand">
        <img src="/static/icons/logo-chalukya.png?v=175" alt="Chalukya Tiles" width="200" height="68">
        <h1>Login</h1>
        <p>Sign in to the Chalukya Tiles admin panel</p>
      </div>
      <form class="admin-login__form" id="admin-login-form" novalidate>
        <label class="admin-field">
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label class="admin-field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="admin-form-error" id="login-error" hidden></p>
        <button class="admin-btn admin-btn--primary" type="submit">Sign in</button>
      </form>
      <a class="admin-login__back" href="/">← Back to website</a>
    </div>
  </main>
  <script src="/static/js/admin.js?v182-oxford" defer></script>
</body>
</html>
